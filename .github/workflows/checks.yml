name: Non-hardware checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest numpy PyYAML Pillow opencv-python-headless
      - name: Python syntax (application code)
        run: python -m compileall -q scripts ros2_ws/src/ur5-vla-dataset-recorder
      - name: Shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Pure application regression tests
        env:
          PYTHONPATH: scripts:ros2_ws/src/ur5-vla-dataset-recorder
        run: >-
          python -m pytest -q
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_core.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_episode_control.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_episode_writer_paths.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_execution_profile.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_control_engine_startup.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_control_engine_lock.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_standard_pose_script.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_bowl_release.py
          ros2_ws/src/ur5-vla-dataset-recorder/test/test_cross_grid_results.py
